services:
  shop:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      ENABLE_TEST_API: 'true'
      CLIENT_DIST: /app/client/dist
      JWT_SECRET: ${JWT_SECRET:-pw-trainer-dev-secret-change-me}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
